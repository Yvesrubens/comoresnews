name: Import des sujets (presse comorienne)
on:
  schedule:
    - cron: '0 4 * * *'   # 7h aux Comores (UTC+3)
    - cron: '0 9 * * *'   # 12h
    - cron: '0 15 * * *'  # 18h
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: import-sources
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/import-sources.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
