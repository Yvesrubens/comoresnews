<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Comoresnews — Back-office</title>
<style>
  :root { --brand:#111; --accent:#c0392b; --ok:#1e824c; --border:#e3e3e3; --muted:#777; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#222; background:#f4f5f7; }
  header.top { background:#111; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 20px; }
  header.top .brand { font-weight:800; letter-spacing:.5px; }
  header.top .who { font-size:13px; color:#ccc; }
  header.top button { margin-left:12px; }
  button { cursor:pointer; border:1px solid var(--border); background:#fff; padding:7px 12px; border-radius:6px; font-size:14px; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  button.accent { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .wrap { max-width:960px; margin:0 auto; padding:20px; }
  .auth { max-width:420px; margin:70px auto; background:#fff; padding:32px; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,.08); }
  .auth h1 { margin:0 0 18px; font-size:20px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:inherit; }
  textarea { min-height:220px; resize:vertical; }
  .tabs { display:flex; gap:6px; margin:16px 0; flex-wrap:wrap; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .card { background:#fff; border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; font-weight:700; text-transform:uppercase; }
  .b-brouillon { background:#eee; color:#666; }
  .b-en_attente { background:#fdebd0; color:#a15b00; }
  .b-programme { background:#d6eaf8; color:#1f6391; }
  .b-publie { background:#d5f5e3; color:#1e824c; }
  .msg { padding:10px 12px; border-radius:6px; margin:10px 0; font-size:14px; }
  .msg.err { background:#fdecea; color:#a12; }
  .msg.ok { background:#eafaf1; color:#186a3b; }
  .muted { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .grid img { width:100%; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer; }
  .preview { border:1px solid var(--border); border-radius:6px; padding:12px; background:#fafafa; min-height:80px; }
  .hidden { display:none; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
</style>
<script src="./vendor/markdown-it.min.js" defer></script>
</head>
<body>

<!-- CONNEXION -->
<div id="auth" class="auth hidden">
  <h1>Comoresnews — Connexion</h1>
  <div id="authMsg"></div>
  <label>Email</label>
  <input id="email" type="email" autocomplete="username">
  <label>Mot de passe</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="actions">
    <button class="primary" id="btnLogin">Se connecter</button>
    <button id="btnForgot">Mot de passe oublié</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <span class="brand">COMORESNEWS · Admin</span>
    <span><span class="who" id="who"></span><button id="btnLogout">Déconnexion</button></span>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-view="list" class="active">Articles</button>
      <button data-view="media">Médiathèque</button>
      <button data-view="users" class="adminOnly hidden">Utilisateurs</button>
      <button data-view="cats" class="adminOnly hidden">Catégories</button>
    </div>
    <div id="globalMsg"></div>

    <!-- LISTE ARTICLES -->
    <section id="view-list">
      <div class="row" style="align-items:flex-end;">
        <div>
          <label>Statut</label>
          <select id="fStatut"><option value="">Tous</option>
            <option value="brouillon">Brouillon</option><option value="en_attente">En attente</option>
            <option value="programme">Programmé</option><option value="publie">Publié</option></select>
        </div>
        <div><label>Catégorie</label><select id="fCat"><option value="">Toutes</option></select></div>
        <div style="flex:0 0 auto;"><label>&nbsp;</label><button class="primary" id="btnNew">+ Nouvel article</button></div>
      </div>
      <div class="card"><table><thead><tr><th>Titre</th><th>Catégorie</th><th>Statut</th><th>Date</th><th></th></tr></thead>
        <tbody id="listBody"></tbody></table></div>
    </section>

    <!-- EDITEUR -->
    <section id="view-edit" class="hidden">
      <div id="editMsg"></div>
      <div class="card">
        <div class="row">
          <div><label>Titre</label><input id="e-titre"></div>
          <div><label>Slug (URL)</label><input id="e-slug"></div>
        </div>
        <div class="row">
          <div><label>Catégorie</label><select id="e-cat"></select></div>
          <div><label>Image de couverture (URL)</label><input id="e-image" placeholder="via Médiathèque ou URL"></div>
        </div>
        <label>Chapô (excerpt)</label><textarea id="e-excerpt" style="min-height:70px"></textarea>
        <div class="row">
          <div><label>Corps (Markdown)</label><textarea id="e-body"></textarea></div>
          <div><label>Aperçu</label><div class="preview" id="e-preview"></div></div>
        </div>
        <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">SEO</summary>
          <label>Titre SEO</label><input id="e-seotitre">
          <label>Meta description</label><textarea id="e-seodesc" style="min-height:60px"></textarea>
          <label>Image de partage (OG, URL)</label><input id="e-ogimage">
          <label>Mots-clés (séparés par des virgules)</label><input id="e-keywords">
        </details>
        <div class="row" style="margin-top:10px">
          <div><label>Date de programmation (si programmé)</label><input id="e-datep" type="datetime-local"></div>
        </div>
        <div id="reviewBox" class="msg hidden"></div>
        <div class="actions">
          <button id="a-brouillon">Enregistrer brouillon</button>
          <button class="primary" id="a-soumettre">Soumettre à validation</button>
          <button class="ok adminOnly hidden" id="a-publier">Publier</button>
          <button class="adminOnly hidden" id="a-programmer">Programmer</button>
          <button class="adminOnly hidden" id="a-renvoyer">Renvoyer en brouillon…</button>
          <button class="accent hidden" id="a-supprimer">Supprimer</button>
          <button id="a-annuler">Annuler</button>
        </div>
      </div>
    </section>

    <!-- MEDIATHEQUE -->
    <section id="view-media" class="hidden">
      <div class="card">
        <label>Ajouter une image</label>
        <input id="m-file" type="file" accept="image/*">
        <div id="mediaMsg"></div>
      </div>
      <div class="card"><div class="grid" id="mediaGrid"></div></div>
    </section>

    <!-- UTILISATEURS -->
    <section id="view-users" class="hidden">
      <div class="card">
        <label>Inviter un rédacteur (email)</label>
        <div class="row"><input id="u-email" type="email" placeholder="prenom@exemple.fr">
          <input id="u-nom" placeholder="Nom affiché">
          <button class="primary" id="btnInvite" style="flex:0 0 auto">Inviter</button></div>
        <div id="userMsg"></div>
      </div>
      <div class="card"><table><thead><tr><th>Nom</th><th>Rôle</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody></table></div>
    </section>

    <!-- CATEGORIES -->
    <section id="view-cats" class="hidden">
      <div class="card">
        <div class="row"><input id="c-slug" placeholder="slug (ex: culture)">
          <input id="c-nom" placeholder="Nom (ex: Culture)">
          <input id="c-ordre" type="number" placeholder="ordre" style="max-width:100px">
          <button class="primary" id="btnCat" style="flex:0 0 auto">Ajouter / MàJ</button></div>
        <div id="catMsg"></div>
      </div>
      <div class="card"><table><thead><tr><th>Slug</th><th>Nom</th><th>Ordre</th><th></th></tr></thead>
        <tbody id="catsBody"></tbody></table></div>
    </section>
  </div>
</div>

<script type="module">
import { createApi } from './supabase.mjs';
import { slugify, validateArticleDB, formToRow } from './lib.mjs';

// Config publique (anon + URL — sans danger dans le navigateur)
const CONFIG = {
  url: 'https://flednhvntwyxirepijyn.supabase.co',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsZWRuaHZudHd5eGlyZXBpanluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDgwMzcsImV4cCI6MjEwMTUyNDAzN30.eIyZ5mrJSeOntlyYqux_DyEr4BfRYZg04jTpquXUobQ',
  deployHook: 'https://api.vercel.com/v1/integrations/deploy/prj_Dj6Yemh2ZfekpjA41t58WbkRpuUi/3NLAq3Fe4l',
};
const api = createApi(CONFIG);
const $ = (id) => document.getElementById(id);
const md = window.markdownit({ html:false, linkify:true, typographer:true });
let PROFILE = null, CATS = [], EDITING = null; // EDITING = ligne article ou null (création)

function msg(el, text, kind='ok'){ el.innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ''; }
function show(view){
  for (const s of ['list','edit','media','users','cats']) $('view-'+s).classList.toggle('hidden', s!==view);
  for (const b of $('tabs').children) b.classList.toggle('active', b.dataset.view===view);
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- AUTH ----------
async function boot(){
  const { data } = await api.getSession();
  if (data.session) await onLogged(); else { $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); }
}
async function onLogged(){
  PROFILE = await api.currentProfile();
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = `${PROFILE.email} · ${PROFILE.role}`;
  const isAdmin = PROFILE.role === 'admin';
  for (const el of document.querySelectorAll('.adminOnly')) el.classList.toggle('hidden', !isAdmin);
  await loadCategories();
  show('list'); await refreshList();
}
$('btnLogin').onclick = async () => {
  const { error } = await api.signIn($('email').value.trim(), $('password').value);
  if (error) return msg($('authMsg'), 'Connexion échouée : '+error.message, 'err');
  await onLogged();
};
$('btnForgot').onclick = async () => {
  const email = $('email').value.trim(); if (!email) return msg($('authMsg'),"Saisis ton email d'abord.",'err');
  const { error } = await api.resetPassword(email);
  msg($('authMsg'), error ? error.message : 'Email de réinitialisation envoyé.', error?'err':'ok');
};
$('btnLogout').onclick = async () => { await api.signOut(); location.reload(); };

// ---------- CATEGORIES (chargement) ----------
async function loadCategories(){
  const { data } = await api.listCategories(); CATS = data || [];
  const opts = CATS.map(c=>`<option value="${c.slug}">${esc(c.nom)}</option>`).join('');
  $('fCat').innerHTML = '<option value="">Toutes</option>'+opts;
  $('e-cat').innerHTML = opts;
}

// ---------- LISTE ----------
async function refreshList(){
  const { data, error } = await api.listArticles({ statut:$('fStatut').value||undefined, categorie:$('fCat').value||undefined });
  if (error) return msg($('globalMsg'), error.message, 'err');
  $('listBody').innerHTML = (data||[]).map(a=>{
    const d = (a.date_publication||a.date_programmee||a.maj_le||'').slice(0,10);
    const cat = (CATS.find(c=>c.slug===a.categorie)||{}).nom || a.categorie;
    return `<tr><td>${esc(a.titre)}</td><td>${esc(cat)}</td><td><span class="badge b-${a.statut}">${a.statut.replace('_',' ')}</span></td>
      <td>${d}</td><td><button data-edit="${a.id}">Ouvrir</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" class="muted">Aucun article.</td></tr>';
  for (const b of $('listBody').querySelectorAll('[data-edit]')) b.onclick = () => openEditor(b.dataset.edit);
}
$('fStatut').onchange = refreshList; $('fCat').onchange = refreshList;
$('btnNew').onclick = () => openEditor(null);

// ---------- EDITEUR ----------
async function openEditor(id){
  EDITING = null;
  if (id){ const { data } = await api.getArticle(id); EDITING = data; }
  const a = EDITING || {};
  $('e-titre').value = a.titre||''; $('e-slug').value = a.slug||''; $('e-cat').value = a.categorie||CATS[0]?.slug||'';
  $('e-image').value = a.image_couverture||''; $('e-excerpt').value = a.excerpt||''; $('e-body').value = a.corps||'';
  $('e-seotitre').value = a.seo_titre||''; $('e-seodesc').value = a.seo_description||''; $('e-ogimage').value = a.og_image||'';
  $('e-keywords').value = (a.mots_cles||[]).join(', ');
  $('e-datep').value = a.date_programmee ? a.date_programmee.slice(0,16) : '';
  renderPreview();
  const rb = $('reviewBox');
  if (a.commentaire_relecture){ rb.className='msg err'; rb.textContent='Renvoyé : '+a.commentaire_relecture; rb.classList.remove('hidden'); }
  else rb.classList.add('hidden');
  $('a-supprimer').classList.toggle('hidden', !id);
  msg($('editMsg'),'');
  show('edit');
}
$('e-titre').oninput = () => { if (!EDITING) $('e-slug').value = slugify($('e-titre').value); };
$('e-body').oninput = renderPreview;
function renderPreview(){ $('e-preview').innerHTML = md.render($('e-body').value||''); }

function gatherForm(action){
  return {
    action,
    titre: $('e-titre').value.trim(), slug: $('e-slug').value.trim(), categorie: $('e-cat').value,
    corps: $('e-body').value, excerpt: $('e-excerpt').value, image_couverture: $('e-image').value.trim(),
    seo_titre: $('e-seotitre').value.trim(), seo_description: $('e-seodesc').value.trim(),
    og_image: $('e-ogimage').value.trim(),
    mots_cles: $('e-keywords').value.split(',').map(s=>s.trim()).filter(Boolean),
    date_programmee: $('e-datep').value ? new Date($('e-datep').value).toISOString() : null,
  };
}
async function save(action){
  const form = gatherForm(action);
  const errs = validateArticleDB(form);
  if (errs.length) return msg($('editMsg'), 'Champs à corriger : '+errs.join(', '), 'err');
  const row = formToRow(form, PROFILE.id);
  const res = EDITING ? await api.updateArticle(EDITING.id, row) : await api.insertArticle(row);
  if (res.error) return msg($('editMsg'), res.error.message, 'err');
  EDITING = res.data;
  const published = ['publie','programme'].includes(row.statut);
  if (published) await api.triggerDeploy().catch(()=>{});
  msg($('editMsg'), 'Enregistré.' + (published ? ' Régénération du site déclenchée.' : ''), 'ok');
  await refreshList();
}
$('a-brouillon').onclick = () => save('brouillon');
$('a-soumettre').onclick = () => save('soumettre');
$('a-publier').onclick = () => save('publier');
$('a-programmer').onclick = () => { if (!$('e-datep').value) return msg($('editMsg'),'Choisis une date de programmation.','err'); save('programmer'); };
$('a-renvoyer').onclick = async () => {
  if (!EDITING) return; const c = prompt('Motif du renvoi en brouillon :'); if (c===null) return;
  const { error } = await api.updateArticle(EDITING.id, { statut:'brouillon', commentaire_relecture:c });
  if (error) return msg($('editMsg'), error.message,'err'); msg($('editMsg'),'Renvoyé en brouillon.','ok'); await refreshList();
};
$('a-supprimer').onclick = async () => {
  if (!EDITING || !confirm('Supprimer définitivement cet article ?')) return;
  const { error } = await api.deleteArticle(EDITING.id);
  if (error) return msg($('editMsg'), error.message,'err');
  await api.triggerDeploy().catch(()=>{}); show('list'); await refreshList();
};
$('a-annuler').onclick = () => { show('list'); };

// ---------- NAVIGATION ONGLETS ----------
$('tabs').onclick = (e) => {
  const v = e.target.dataset.view; if (!v) return;
  show(v);
  if (v==='media') refreshMedia(); else if (v==='users') refreshUsers();
  else if (v==='cats') refreshCats(); else if (v==='list') refreshList();
};

// ---------- MEDIATHEQUE ----------
$('m-file').onchange = async () => {
  const f = $('m-file').files[0]; if (!f) return;
  msg($('mediaMsg'),'Envoi…');
  const { data, error } = await api.uploadMedia(f);
  if (error) return msg($('mediaMsg'), error.message,'err');
  msg($('mediaMsg'), 'Ajoutée : '+data.url,'ok'); refreshMedia();
};
async function refreshMedia(){
  const { data } = await api.listMedia();
  $('mediaGrid').innerHTML = (data||[]).map(m=>`<img src="${m.url}" title="${esc(m.chemin)}" data-url="${m.url}">`).join('') || '<span class="muted">Aucune image.</span>';
  for (const img of $('mediaGrid').querySelectorAll('img')) img.onclick = () => { navigator.clipboard?.writeText(img.dataset.url); msg($('mediaMsg'),'URL copiée : '+img.dataset.url,'ok'); };
}

// ---------- UTILISATEURS ----------
async function refreshUsers(){
  const { data } = await api.listProfiles();
  $('usersBody').innerHTML = (data||[]).map(u=>`<tr><td>${esc(u.nom||'(sans nom)')}</td>
    <td><select data-role="${u.id}"><option value="redacteur" ${u.role==='redacteur'?'selected':''}>redacteur</option>
    <option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select></td>
    <td class="muted">${u.id.slice(0,8)}…</td></tr>`).join('');
  for (const s of $('usersBody').querySelectorAll('[data-role]')) s.onchange = async () => {
    const { error } = await api.setRole(s.dataset.role, s.value); msg($('userMsg'), error?error.message:'Rôle mis à jour.', error?'err':'ok');
  };
}
$('btnInvite').onclick = async () => {
  const email = $('u-email').value.trim(); if (!email) return;
  const { error } = await api.inviteUser(email, $('u-nom').value.trim());
  msg($('userMsg'), error ? ('Invitation impossible : '+error.message) : 'Invitation envoyée à '+email, error?'err':'ok');
};

// ---------- CATEGORIES ----------
async function refreshCats(){
  await loadCategories();
  $('catsBody').innerHTML = CATS.map(c=>`<tr><td>${c.slug}</td><td>${esc(c.nom)}</td><td>${c.ordre}</td>
    <td><button data-delcat="${c.slug}">Suppr.</button></td></tr>`).join('');
  for (const b of $('catsBody').querySelectorAll('[data-delcat]')) b.onclick = async () => {
    if (!confirm('Supprimer la catégorie '+b.dataset.delcat+' ?')) return;
    const { error } = await api.deleteCategory(b.dataset.delcat); msg($('catMsg'), error?error.message:'Supprimée.', error?'err':'ok'); refreshCats();
  };
}
$('btnCat').onclick = async () => {
  const slug = $('c-slug').value.trim(); if (!slug) return;
  const { error } = await api.saveCategory({ slug, nom:$('c-nom').value.trim()||slug, ordre:Number($('c-ordre').value||0) });
  msg($('catMsg'), error?error.message:'Enregistrée.', error?'err':'ok'); refreshCats();
};

boot();
</script>
</body>
</html>
